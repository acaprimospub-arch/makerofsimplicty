<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Menu — Mos Pub Mercière</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOS">
  <meta name="theme-color" content="#060e15">
</head>
<body>
  <nav id="nav" role="navigation" aria-label="Navigation principale"></nav>

  <div class="page" id="main-content">
    <div class="menu-header">
      <p class="menu-greeting">Bonjour, <span id="menu-name">…</span></p>
      <p class="menu-subtitle" id="menu-subtitle"></p>
      <div class="menu-date-badge" id="menu-date">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
        </svg>
        <span id="menu-date-text"></span>
      </div>
    </div>
    <nav aria-label="Modules disponibles">
      <ul class="menu-grid" id="menu-grid" role="list">
      </ul>
    </nav>
  </div>

  <script src="/js/api.js"></script>
  <script>
    'use strict';

    const TILE_ICONS = {
      '/admin/dashboard.html':        '📊',
      '/admin/equipe.html':           '👥',
      '/admin/admin.html':            '⚙️',
      '/staff/reservations.html':     '📅',
      '/staff/tables.html':           '📋',
      '/staff/taches.html':           '✅',
      '/staff/planning.html':         '📆',
      '/staff/conges.html':           '🌴',
      '/cuisine/index.html':          '🍳',
      '/cuisine/taches.html':         '✅',
      '/cuisine/recettes.html':       '📖',
      '/cuisine/etiquettes.html':     '🔖',
      '/resa/devis.html':             '📝',
      '/marketing/dashboard.html':    '📈',
      '/marketing/reservations.html': '📅',
      '/admin/joy.html':              '🎉',
      '/resa/dashboard.html':         '📊',
      '/resa/gestion.html':           '📋',
      '/resa/suivi.html':             '📈',
      '/kiosk.html':                  '⏰',
      '/admin/pointages.html':        '📋',
    };

    const MENU_ITEMS = {
      admin: [
        { label: 'Dashboard',     href: '/admin/dashboard.html' },
        { label: 'Gestion Staff', href: '/admin/equipe.html' },
        { label: 'Réservations',  href: '/staff/reservations.html' },
        { label: 'Plan de salle', href: '/staff/tables.html' },
        { label: 'Cuisine',       href: '/cuisine/index.html' },
        { label: 'Admin',         href: '/admin/admin.html' },
        { label: 'Planning',      href: '/staff/planning.html' },
        { label: 'Congés',        href: '/staff/conges.html' },
        { label: 'Pointeuse',     href: '/kiosk.html' },
        { label: 'Pointages',     href: '/admin/pointages.html' },
      ],
      manager_midi: [
        { label: 'Dashboard',    href: '/admin/dashboard.html' },
        { label: 'Tâches',       href: '/staff/taches.html' },
        { label: 'Réservations', href: '/staff/reservations.html' },
        { label: 'Plan de salle',href: '/staff/tables.html' },
      ],
      manager_soir: [
        { label: 'Dashboard',    href: '/admin/dashboard.html' },
        { label: 'Tâches',       href: '/staff/taches.html' },
        { label: 'Réservations', href: '/staff/reservations.html' },
        { label: 'Plan de salle',href: '/staff/tables.html' },
        { label: 'Planning',     href: '/staff/planning.html' },
      ],
      staff_midi: [
        { label: 'Tâches',       href: '/staff/taches.html' },
        { label: 'Réservations', href: '/staff/reservations.html' },
        { label: 'Plan de salle',href: '/staff/tables.html' },
        { label: 'Planning',     href: '/staff/planning.html' },
      ],
      staff_soir: [
        { label: 'Tâches',       href: '/staff/taches.html' },
        { label: 'Réservations', href: '/staff/reservations.html' },
        { label: 'Plan de salle',href: '/staff/tables.html' },
        { label: 'Planning',     href: '/staff/planning.html' },
      ],
      cuisine: [
        { label: 'Tâches',        href: '/cuisine/taches.html' },
        { label: 'Recettes',      href: '/cuisine/recettes.html' },
        { label: 'Planning',      href: '/staff/planning.html' },
        { label: 'Congés',        href: '/staff/conges.html' },
      ],
      marketing: [
        { label: 'Dashboard',    href: '/marketing/dashboard.html' },
        { label: 'Réservations', href: '/marketing/reservations.html' },
        { label: 'Joy.io',       href: '/admin/joy.html' },
        { label: 'Devis',        href: '/resa/devis.html' },
        { label: 'Planning',     href: '/staff/planning.html' },
      ],
      resa: [
        { label: 'Dashboard', href: '/resa/dashboard.html' },
        { label: 'Gestion',   href: '/resa/gestion.html' },
        { label: 'Suivi',     href: '/resa/suivi.html' },
        { label: 'Devis',     href: '/resa/devis.html' },
        { label: 'Planning',  href: '/staff/planning.html' },
      ],
    };

    const SUBTITLES = {
      admin:        'Accès administrateur',
      manager_midi: 'Service du midi',
      manager_soir: 'Service du soir',
      staff_midi:   'Service du midi',
      staff_soir:   'Service du soir',
      cuisine:      'Équipe cuisine',
      marketing:    'Marketing',
      resa:         'Réservations',
    };

    const DEFAULT_ICON = `<svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="6"/></svg>`;

    function formatDate() {
      const now = new Date();
      return now.toLocaleDateString('fr-FR', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
    }

    async function init() {
      const user = await api.get('/api/auth/me');
      if (!user || !user.id) { window.location.href = '/'; return; }
      window.__mosUser = user;

      let menuKey;
      if (user.role === 'admin')                                 menuKey = 'admin';
      else if (user.shift === 'resa')                            menuKey = 'resa';
      else if (user.shift === 'marketing')                       menuKey = 'marketing';
      else if (user.shift === 'cuisine')                         menuKey = 'cuisine';
      else if (user.role === 'manager' && user.shift === 'midi') menuKey = 'manager_midi';
      else if (user.role === 'manager' && user.shift === 'soir') menuKey = 'manager_soir';
      else if (user.shift === 'midi')                            menuKey = 'staff_midi';
      else                                                        menuKey = 'staff_soir';

      document.getElementById('menu-name').textContent  = user.name;
      document.getElementById('menu-subtitle').textContent = SUBTITLES[menuKey] || '';
      document.getElementById('menu-date-text').textContent = formatDate();
      document.title = `Menu — ${user.name}`;

      const items = MENU_ITEMS[menuKey] || [];
      document.getElementById('menu-grid').innerHTML = items.map(item => `
        <li role="listitem">
          <a href="${escapeHtml(item.href)}" class="menu-tile" aria-label="${escapeHtml(item.label)}">
            <span class="menu-tile-icon" aria-hidden="true">
              ${TILE_ICONS[item.href] || DEFAULT_ICON}
            </span>
            <span class="menu-tile-label">${escapeHtml(item.label)}</span>
          </a>
        </li>
      `).join('');

      const nav = document.getElementById('nav');
      nav.setAttribute('aria-label', 'Navigation principale');
      nav.innerHTML = `
        <a href="/menu.html" class="nav-logo" aria-current="page" aria-label="Menu — MOS Pub Mercière">
          <img src="/images/logo.png" alt="MOS" class="nav-logo-img"
               onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
          <span class="nav-logo-text" style="display:none;" aria-hidden="true">MOS</span>
        </a>
        <div class="nav-links"></div>
        <div class="nav-right">
          <span class="nav-user" aria-label="Connecté en tant que ${escapeHtml(user.name)}">${escapeHtml(user.name)}</span>
          <button class="btn-logout" id="btn-logout" type="button" aria-label="Se déconnecter">Déco.</button>
        </div>
      `;
      document.getElementById('btn-logout').addEventListener('click', () => logout());
    }

    init();
  </script>
</body>
</html>
