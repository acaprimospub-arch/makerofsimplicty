<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Planning — Mos Pub Mercière</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOS">
  <meta name="theme-color" content="#08141c">
  <style>
    /* ── Nav semaine ── */
    .week-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:16px; }
    .week-nav-btn { background:var(--bg-card); border:1px solid var(--border); color:var(--text-muted); border-radius:20px; padding:7px 16px; font-size:.82rem; cursor:pointer; transition:border-color .15s,color .15s; white-space:nowrap; }
    .week-nav-btn:hover { border-color:var(--primary); color:var(--primary); }
    .week-nav-btn:focus-visible { box-shadow:var(--focus-ring); outline:none; }
    .week-label { font-size:.92rem; font-weight:700; text-align:center; flex:1; }

    /* ── Grille planning ── */
    .planning-grid { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .planning-table { width:100%; border-collapse:collapse; }
    .planning-table th { background:var(--bg-surface); border:1px solid var(--border); padding:7px 5px; font-size:.72rem; font-weight:700; text-align:center; color:var(--text-muted); white-space:nowrap; }
    .planning-table th.today-col { background:var(--primary-dim); color:var(--primary); border-color:var(--primary); }
    .planning-table td { border:1px solid var(--border); padding:3px; vertical-align:top; }

    /* ── Cellules salle ── */
    .staff-name-cell { background:var(--bg-card); padding:8px 10px; font-weight:700; font-size:.85rem; white-space:nowrap; min-width:100px; }
    #salleTable { min-width:620px; }
    #salleTable td { min-width:82px; }
    .shift-badge { display:inline-block; font-size:.62rem; font-weight:600; padding:2px 6px; border-radius:10px; margin-left:4px; vertical-align:middle; }
    .shift-badge.midi { background:rgba(205,164,67,.15); color:var(--primary); }
    .shift-badge.soir { background:rgba(99,102,241,.15); color:#818cf8; }
    .btn-dup { display:inline-flex; align-items:center; justify-content:center; margin-left:6px; padding:2px 6px; font-size:.7rem; font-weight:700; background:rgba(205,164,67,.12); color:var(--primary); border:1px solid rgba(205,164,67,.35); border-radius:4px; cursor:pointer; transition:background .12s; vertical-align:middle; white-space:nowrap; }
    .btn-dup:hover { background:rgba(205,164,67,.25); }
    .btn-dup:focus-visible { box-shadow:var(--focus-ring); outline:none; }
    .group-sep td { background:var(--bg-surface); height:4px; padding:0; border:none; }
    .day-cell { background:var(--bg-card); min-height:60px; display:flex; flex-direction:column; gap:2px; border-radius:4px; padding:5px 6px; }
    .day-cell.clickable { cursor:pointer; transition:background .12s; }
    .day-cell.clickable:hover { background:var(--bg-hover); }
    .day-cell.clickable:focus-visible { box-shadow:var(--focus-ring); outline:none; }
    .day-cell.is-off   { background:rgba(232,84,84,.06); border:1px solid rgba(232,84,84,.2); }
    .day-cell.is-empty { border:1.5px dashed var(--border); }
    .dc-off { font-size:.72rem; font-weight:600; color:var(--danger); }
    .dc-row { display:flex; align-items:center; gap:4px; font-size:.72rem; line-height:1.3; }
    .dc-label { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.3px; opacity:.6; min-width:14px; }
    .dc-val { font-weight:700; }
    .dc-val.prevu { color:var(--text-muted); }
    .row-me .staff-name-cell { color:var(--primary); font-weight:800; }
    .row-me .day-cell:not(.is-off):not(.is-empty) { background:rgba(205,164,67,.08); }
    .row-me .day-cell.is-empty { border-color:rgba(205,164,67,.25); }
    .today-col .day-cell { background:rgba(205,164,67,.04); }
    .today-col .day-cell.clickable:hover { background:rgba(205,164,67,.12); }

    /* ── Cellules cuisine ── */
    #cuisineTable { min-width:580px; }
    #cuisineTable td { min-width:76px; }
    .shift-cell { background:var(--bg-card); min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:4px; padding:4px; text-align:center; }
    .shift-cell[role="button"] { cursor:pointer; transition:background .12s; }
    .shift-cell[role="button"]:hover { background:var(--bg-hover); }
    .shift-cell[role="button"]:focus-visible { box-shadow:var(--focus-ring); outline:none; }
    .shift-cell.is-work  { background:rgba(205,164,67,.12); border:1.5px solid rgba(205,164,67,.35); }
    .shift-cell.is-off   { background:rgba(232,84,84,.07);  border:1.5px solid rgba(232,84,84,.25); }
    .shift-cell.is-empty { border:1.5px dashed var(--border); }
    .shift-cell .sc-time  { font-size:.76rem; font-weight:700; color:var(--primary); line-height:1.2; }
    .shift-cell .sc-off   { font-size:.72rem; font-weight:600; color:var(--danger); }
    .shift-cell .sc-empty { font-size:.68rem; color:var(--text-muted); }
    .today-col .shift-cell.is-work { background:rgba(205,164,67,.2); border-color:var(--primary); }
    .row-me .shift-cell.is-work  { background:rgba(205,164,67,.2); border-color:rgba(205,164,67,.5); }
    .row-me .shift-cell.is-empty { border-color:rgba(205,164,67,.25); }

    /* ── Badges supp/retard ── */
    .dc-supp   { font-size:.65rem; font-weight:700; color:var(--success); background:var(--success-bg); border-radius:8px; padding:1px 5px; display:inline-block; margin-top:1px; }
    .dc-retard { font-size:.65rem; font-weight:700; color:var(--danger); background:rgba(232,84,84,.12); border-radius:8px; padding:1px 5px; display:inline-block; margin-top:1px; }

    /* ── Légende ── */
    .legend { display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px; font-size:.72rem; color:var(--text-muted); }

    /* ── Readonly badge ── */
    .readonly-badge { display:inline-flex; align-items:center; gap:5px; font-size:.75rem; color:var(--text-muted); background:var(--bg-surface); border:1px solid var(--border); border-radius:20px; padding:4px 12px; margin-bottom:12px; }

    /* ── Congés admin ── */
    .demande-item { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; margin-bottom:8px; font-size:13px; }
    .demande-info { flex:1; min-width:0; }
    .demande-info strong { display:block; font-size:13px; }
    .demande-info small  { color:var(--text-muted); font-size:11px; }
    .demande-motif { font-size:11px; color:var(--text-muted); font-style:italic; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .demande-name  { font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:2px; }
    .demande-actions { display:flex; gap:6px; flex-shrink:0; }
    .btn-approve { padding:4px 10px; border-radius:6px; border:1px solid var(--success); background:var(--success-bg); color:var(--success); font-size:11px; font-weight:700; cursor:pointer; }
    .btn-reject  { padding:4px 10px; border-radius:6px; border:1px solid var(--danger); background:rgba(232,84,84,.08); color:var(--danger); font-size:11px; font-weight:700; cursor:pointer; }
    .status-pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; flex-shrink:0; }
    .sp-pending  { background:rgba(245,166,36,.15); color:#F5A624; }
    .sp-approved { background:var(--success-bg); color:var(--success); }
    .sp-rejected { background:rgba(232,84,84,.12); color:var(--danger); }

    /* ── Drawers ── */
    .drawer-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; opacity:0; pointer-events:none; transition:opacity .25s; }
    .drawer-backdrop.open { opacity:1; pointer-events:auto; }
    .drawer { position:fixed; bottom:0; left:0; right:0; z-index:201; background:var(--bg-card); border-radius:20px 20px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.5); transform:translateY(102%); transition:transform .3s cubic-bezier(.32,.72,0,1); max-height:92dvh; display:flex; flex-direction:column; }
    .drawer.open { transform:translateY(0); }
    @media (min-width:641px) {
      .drawer { bottom:auto; top:50%; left:50%; right:auto; transform:translate(-50%,-40%); opacity:0; pointer-events:none; border-radius:var(--radius); width:100%; max-width:400px; transition:transform .25s ease,opacity .25s ease; }
      .drawer.open { transform:translate(-50%,-50%); opacity:1; pointer-events:auto; }
    }
    .drawer-handle { width:40px; height:4px; background:rgba(255,255,255,.15); border-radius:2px; margin:10px auto 0; flex-shrink:0; }
    @media (min-width:641px) { .drawer-handle { display:none; } }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 12px; flex-shrink:0; border-bottom:1px solid var(--border); }
    .drawer-title { font-size:1rem; font-weight:700; }
    .drawer-close { width:30px; height:30px; border-radius:50%; background:var(--bg-surface); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; font-size:1.1rem; }
    .drawer-close:focus-visible { box-shadow:var(--focus-ring); outline:none; }
    .drawer-body { overflow-y:auto; padding:16px 20px; flex:1; }
    .drawer-footer { display:flex; gap:8px; padding:10px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex-shrink:0; }
    .drawer-footer .btn { flex:1; justify-content:center; min-height:46px; }

    .frow { display:flex; flex-direction:column; gap:12px; }
    .fgroup { display:flex; flex-direction:column; gap:5px; }
    .fgroup label { font-size:.8rem; font-weight:600; color:var(--text-muted); }
    .f2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-input { background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 12px; font-size:14px; width:100%; box-sizing:border-box; font-family:inherit; }
    .off-toggle-label { display:flex; align-items:center; gap:12px; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; cursor:pointer; }
    .off-toggle-label input { width:18px; height:18px; cursor:pointer; accent-color:var(--danger); }
    .drawer-section-title { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-muted); margin-bottom:6px; margin-top:4px; }
    .supp-item { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:var(--bg-surface); border-radius:8px; border:1px solid var(--border); font-size:.82rem; margin-bottom:6px; }
    .supp-del { background:none; border:none; color:var(--danger); cursor:pointer; font-size:.9rem; padding:2px 6px; }
    .add-supp-row { display:flex; gap:8px; align-items:flex-end; }
    .add-supp-row .form-input { flex:1; }
    .type-toggle { display:flex; gap:6px; margin-bottom:10px; }
    .type-btn { padding:5px 14px; border:1.5px solid var(--border); border-radius:20px; background:var(--bg-surface); color:var(--text-muted); font-size:.8rem; font-weight:600; cursor:pointer; transition:border-color .15s,color .15s,background .15s; }
    .type-btn.active[data-type="supp"]   { border-color:var(--success); color:var(--success); background:var(--success-bg); }
    .type-btn.active[data-type="retard"] { border-color:var(--danger);  color:var(--danger);  background:rgba(232,84,84,.1); }
    .info-row { display:flex; justify-content:space-between; font-size:.82rem; padding:8px 12px; background:var(--bg-surface); border-radius:8px; border:1px solid var(--border); }
    .info-row .lbl { color:var(--text-muted); }
    .info-row .val { font-weight:700; }

    /* ── WhatsApp share ── */
    .btn-whatsapp { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:#25d366; color:#fff; border:none; border-radius:var(--radius-sm); padding:13px 20px; font-size:.95rem; font-weight:700; cursor:pointer; transition:background .15s; width:100%; }
    .btn-whatsapp:hover { background:#1da851; }
    .btn-whatsapp svg { width:20px; height:20px; fill:currentColor; flex-shrink:0; }

    /* ── Bouton congé ── */
    .btn-conge { display:inline-flex; align-items:center; gap:7px; padding:9px 16px; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text-muted); font-size:.85rem; font-weight:600; text-decoration:none; cursor:pointer; transition:border-color .15s,color .15s; }
    .btn-conge:hover { border-color:var(--primary); color:var(--primary); }

    @media (prefers-reduced-motion:reduce) { .drawer,.drawer-backdrop { transition:none !important; } }
  </style>
</head>
<body>
  <nav class="nav" id="nav" role="navigation" aria-label="Navigation principale"></nav>

  <main class="page" id="main-content" tabindex="-1">
    <div class="container-sm">

      <header class="page-header" style="margin-bottom:20px">
        <h1 class="page-title">Planning</h1>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap" id="headerActions"></div>
      </header>

      <!-- Onglets — masqués si une seule section visible -->
      <div role="tablist" aria-label="Planning" style="margin-bottom:20px;" class="tabs" id="planningTabs">
        <button role="tab" class="tab active" id="tab-salle"   aria-selected="true"  aria-controls="pane-salle">Salle</button>
        <button role="tab" class="tab"         id="tab-cuisine" aria-selected="false" aria-controls="pane-cuisine" tabindex="-1">Cuisine</button>
      </div>

      <!-- ══════════ ONGLET SALLE ══════════ -->
      <div role="tabpanel" id="pane-salle" aria-labelledby="tab-salle">

        <!-- Vue admin/manager -->
        <div id="salleAdminView" style="display:none">
          <div class="card" style="margin-bottom:16px">
            <div class="week-nav">
              <button class="week-nav-btn" id="saPrev">← Préc.</button>
              <span class="week-label" id="saWeekLabel"></span>
              <button class="week-nav-btn" id="saNext">Suiv. →</button>
            </div>
            <div class="legend">
              <span style="color:var(--text-muted)">P = Prévu</span>
              <span style="color:var(--success)">Supp</span>
              <span style="color:var(--danger)">Retard</span>
            </div>
            <div class="planning-grid">
              <table class="planning-table" id="salleTable" aria-label="Planning salle"></table>
            </div>
          </div>

          <section class="card" id="congesSection" style="display:none">
            <div class="card-header" style="margin-bottom:14px">
              <h2 class="card-title" style="font-size:13px">Demandes de congés</h2>
              <button class="btn btn-sm" id="btnRefreshConges" style="font-size:11px;padding:5px 10px">Actualiser</button>
            </div>
            <div id="allDemandesList" aria-live="polite"><div class="empty-state">Chargement…</div></div>
          </section>
        </div>

        <!-- Vue staff -->
        <div id="salleStaffView" style="display:none">
          <div class="card">
            <div class="week-nav">
              <button class="week-nav-btn" id="ssPrev">← Préc.</button>
              <span class="week-label" id="ssWeekLabel"></span>
              <button class="week-nav-btn" id="ssNext">Suiv. →</button>
            </div>
            <div class="legend">
              <span style="color:var(--text-muted)">P = Prévu</span>
              <span style="color:var(--success)">Supp</span>
              <span style="color:var(--danger)">Retard</span>
            </div>
            <div class="planning-grid">
              <table class="planning-table" id="salleStaffTable" aria-label="Mon planning salle"></table>
            </div>
          </div>
        </div>

      </div>

      <!-- ══════════ ONGLET CUISINE ══════════ -->
      <div role="tabpanel" id="pane-cuisine" aria-labelledby="tab-cuisine" hidden>

        <div id="cuisineReadonlyBadge" class="readonly-badge hidden">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M7 2a5 5 0 100 10A5 5 0 007 2zm0 2a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm0 7a4 4 0 01-3.2-6.4C4.3 5.6 5 6.5 5 7.5c0 .83.5 1.55 1.24 1.87A3 3 0 007 11z"/></svg>
          Lecture seule
        </div>

        <div class="card">
          <div class="week-nav">
            <button class="week-nav-btn" id="cuiPrev">← Préc.</button>
            <span class="week-label" id="cuiWeekLabel"></span>
            <button class="week-nav-btn" id="cuiNext">Suiv. →</button>
          </div>
          <div class="planning-grid">
            <table class="planning-table" id="cuisineTable" aria-label="Planning cuisine">
              <thead id="cuisineHead"></thead>
              <tbody id="cuisineBody"></tbody>
            </table>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- ══ Drawer salle (édition créneau + supp) ══ -->
  <div class="drawer-backdrop" id="salleBackdrop"></div>
  <div class="drawer" id="salleDrawer" role="dialog" aria-modal="true" aria-labelledby="salleDrawerTitle" aria-hidden="true">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="drawer-head">
      <span class="drawer-title" id="salleDrawerTitle">Créneau</span>
      <button class="drawer-close" id="salleDrawerClose">×</button>
    </div>
    <div class="drawer-body"><div class="frow" id="salleDrawerContent"></div></div>
    <div class="drawer-footer" id="salleDrawerFooter"></div>
  </div>

  <!-- ══ Drawers cuisine ══ -->
  <div class="drawer-backdrop" id="cuisineBackdrop"></div>

  <!-- Shift editor -->
  <div class="drawer" id="shiftDrawer" role="dialog" aria-modal="true" aria-labelledby="shiftDrawerTitle">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="drawer-head">
      <span class="drawer-title" id="shiftDrawerTitle">Modifier le shift</span>
      <button class="drawer-close" id="closeShiftDrawer">×</button>
    </div>
    <div class="drawer-body">
      <form id="shiftForm">
        <input type="hidden" id="shiftUserId">
        <input type="hidden" id="shiftDayDate">
        <div class="frow">
          <label class="off-toggle-label" for="shiftIsOff">
            <input type="checkbox" id="shiftIsOff">
            <span>Jour de repos</span>
          </label>
          <div id="shiftTimeFields" class="frow">
            <div class="f2">
              <div class="fgroup"><label for="shiftStart">Début</label><input type="time" id="shiftStart" class="form-input" value="09:00"></div>
              <div class="fgroup"><label for="shiftEnd">Fin</label><input type="time" id="shiftEnd" class="form-input" value="17:00"></div>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="drawer-footer">
      <button class="btn btn-secondary" id="btnClearShift" style="flex:0 0 auto;padding:0 16px" aria-label="Effacer ce créneau">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M2 4h10M5 4V2h4v2M6 6v5M8 6v5M3 4l1 8h6l1-8"/></svg>
      </button>
      <button class="btn btn-secondary" id="cancelShiftDrawer">Annuler</button>
      <button type="submit" form="shiftForm" class="btn btn-primary">Enregistrer</button>
    </div>
  </div>

  <!-- Log drawer (supp/retard) -->
  <div class="drawer" id="logDrawer" role="dialog" aria-modal="true" aria-labelledby="logDrawerTitle">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="drawer-head">
      <span class="drawer-title" id="logDrawerTitle">Saisie</span>
      <button class="drawer-close" id="closeLogDrawer">×</button>
    </div>
    <div class="drawer-body" id="logDrawerBody"></div>
    <div class="drawer-footer">
      <button class="btn btn-secondary" id="closeLogDrawerFooter" style="flex:1;justify-content:center">Fermer</button>
    </div>
  </div>

  <!-- Preview drawer (cuisine WhatsApp) -->
  <div class="drawer" id="previewDrawer" role="dialog" aria-modal="true" aria-labelledby="previewDrawerTitle">
    <div class="drawer-handle" aria-hidden="true"></div>
    <div class="drawer-head">
      <span class="drawer-title" id="previewDrawerTitle">Aperçu du planning</span>
      <button class="drawer-close" id="closePreviewDrawer">×</button>
    </div>
    <div class="drawer-body" style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div id="previewLoading" role="status" style="color:var(--text-muted);font-size:.9rem;">Génération de l'image…</div>
      <img id="previewImg" style="display:none;max-width:100%;border-radius:10px;border:1px solid var(--border);" alt="Aperçu planning cuisine">
    </div>
    <div class="drawer-footer" style="flex-direction:column;gap:10px;">
      <button class="btn-whatsapp" id="btnShare" style="display:none;">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Envoyer sur WhatsApp
      </button>
      <button class="btn btn-secondary" id="closePreviewDrawerFooter" style="justify-content:center;">Fermer</button>
    </div>
  </div>

  <!-- Modal confirmation -->
  <div class="modal-overlay hidden" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal">
      <div class="modal-header"><h2 class="modal-title" id="confirm-title">Confirmer</h2></div>
      <p id="confirmMsg" style="font-size:.9rem;color:var(--text-muted);"></p>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="confirmCancel">Annuler</button>
        <button class="btn btn-danger" id="confirmOk">Confirmer</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script>
    'use strict';
    buildNav('planning');
    const socket = io();

    // ─── Constantes ────────────────────────────────────────────────────────────
    const DAYS_SHORT = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    const DAYS_LONG  = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

    // ─── Helpers ───────────────────────────────────────────────────────────────
    function getMonday(d = new Date()) {
      const dt = new Date(d), day = dt.getDay();
      dt.setDate(dt.getDate() + (day === 0 ? -6 : 1 - day));
      return dt.toISOString().split('T')[0];
    }
    function addDays(s, n) { const d = new Date(s); d.setDate(d.getDate() + n); return d.toISOString().split('T')[0]; }
    function todayStr()    { return new Date().toISOString().split('T')[0]; }
    function fmtWeekShort(w) {
      const e = addDays(w,6), s = new Date(w), en = new Date(e);
      const f = d => `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}`;
      return `${f(s)} — ${f(en)}`;
    }
    function fmtMins(m) { if (!m) return '—'; const h = Math.floor(m/60), mn = m%60; return h>0?(mn>0?`${h}h${String(mn).padStart(2,'0')}`:`${h}h`):`${mn}min`; }

    // ─── État global ───────────────────────────────────────────────────────────
    let currentUser  = null;
    let isAdmin      = false; // admin ou manager salle
    let isChef       = false; // admin ou manager cuisine
    let showSalle    = false;
    let showCuisine  = false;

    // ═══════════════════════════════════════════════════════════════════════════
    // TABS
    // ═══════════════════════════════════════════════════════════════════════════

    let _cuisineLoaded = false;

    function switchTab(tab) {
      ['salle','cuisine'].forEach(t => {
        const btn   = document.getElementById(`tab-${t}`);
        const panel = document.getElementById(`pane-${t}`);
        const active = t === tab;
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
        btn.setAttribute('tabindex',      active ? '0' : '-1');
        btn.classList.toggle('active', active);
        panel.hidden = !active;
      });
      if (tab === 'cuisine' && !_cuisineLoaded) { loadCuisineWeek(); _cuisineLoaded = true; }
    }

    document.querySelectorAll('#planningTabs [role="tab"]').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.id.replace('tab-','')));
      btn.addEventListener('keydown', e => {
        const tabs = ['salle','cuisine'].filter(t => !document.getElementById(`tab-${t}`).hidden);
        const idx  = tabs.indexOf(btn.id.replace('tab-',''));
        let next = -1;
        if (e.key === 'ArrowRight') next = (idx+1) % tabs.length;
        if (e.key === 'ArrowLeft')  next = (idx-1+tabs.length) % tabs.length;
        if (next >= 0) { e.preventDefault(); switchTab(tabs[next]); document.getElementById(`tab-${tabs[next]}`).focus(); }
      });
    });

    // ═══════════════════════════════════════════════════════════════════════════
    // SALLE — GRILLE
    // ═══════════════════════════════════════════════════════════════════════════

    let salleAdminWeek = getMonday();
    let salleStaffWeek = getMonday();
    let salleWeekData  = null;
    let salleEditCtx   = null;

    function buildSalleGrid(tableEl, data, adminMode, myId) {
      const week     = adminMode ? salleAdminWeek : salleStaffWeek;
      const today    = todayStr();
      const dayDates = Array.from({length:7}, (_,i) => addDays(week,i));

      const myShift = currentUser?.shift;
      const users = (adminMode || !myShift || (myShift !== 'midi' && myShift !== 'soir'))
        ? data.users
        : data.users.filter(u => u.shift === myShift);

      let html = '<thead><tr><th style="text-align:left;min-width:100px">Employé</th>';
      dayDates.forEach((dd,i) => {
        html += `<th class="${dd===today?'today-col':''}">${DAYS_SHORT[i]}<br><span style="font-weight:400;font-size:.65rem">${dd.slice(8)}</span></th>`;
      });
      html += '</tr></thead><tbody>';

      let lastShift = null;
      users.forEach(u => {
        if (lastShift && u.shift !== lastShift) html += '<tr class="group-sep"><td colspan="8"></td></tr>';
        lastShift = u.shift;
        const canClick = adminMode || u.id === myId;

        const dupBtn = adminMode ? `<button class="btn-dup" data-dup-uid="${u.id}" data-dup-name="${escapeHtml(u.name)}" title="Copier la semaine précédente">⎘ Dup</button>` : '';
        html += `<tr${u.id===myId?' class="row-me"':''}><td class="staff-name-cell">${escapeHtml(u.name)}<span class="shift-badge ${u.shift}">${u.shift}</span>${dupBtn}</td>`;
        dayDates.forEach((dd,di) => {
          const isToday = dd === today;
          const plan    = data.shifts.find(s => s.user_id===u.id && s.day_date===dd);
          const evs     = (data.timeEvents||[]).filter(e => e.user_id===u.id && e.date===dd);
          const suppMin    = evs.filter(e=>(e.type||'supp')!=='retard').reduce((a,e)=>a+(e.minutes||0),0);
          const retardMin  = evs.filter(e=>e.type==='retard').reduce((a,e)=>a+(e.minutes||0),0);

          let inner='', cls='is-empty';
          if (plan?.is_conge) {
            cls='is-off'; inner=`<span class="dc-off">Congé</span>`;
          } else if (plan?.is_off) {
            cls='is-off'; inner=`<span class="dc-off">Repos</span>`;
          } else {
            const hasPlanned = plan?.start_time;
            if (hasPlanned||suppMin>0||retardMin>0) {
              cls='';
              if (hasPlanned) inner+=`<div class="dc-row"><span class="dc-label">P</span><span class="dc-val prevu">${plan.start_time.slice(0,5)}→${plan.end_time?.slice(0,5)||'?'}</span></div>`;
              if (suppMin>0)   inner+=`<span class="dc-supp">+${fmtMins(suppMin)}</span>`;
              if (retardMin>0) inner+=`<span class="dc-retard">−${fmtMins(retardMin)}</span>`;
            } else {
              inner=`<span style="font-size:.68rem;color:var(--text-muted)">${canClick?'+':'—'}</span>`;
            }
          }

          html+=`<td class="${isToday?'today-col':''}">
            <div class="day-cell ${cls}${canClick?' clickable':''}"
                 ${canClick?'role="button" tabindex="0"':''}
                 data-uid="${u.id}" data-uname="${escapeHtml(u.name)}" data-date="${dd}" data-dayidx="${di}"
                 aria-label="${escapeHtml(u.name)} — ${DAYS_LONG[di]}">
              ${inner}
            </div></td>`;
        });
        html+='</tr>';
      });
      html+='</tbody>';
      tableEl.innerHTML = html;

      tableEl.querySelectorAll('.day-cell.clickable').forEach(cell => {
        cell.addEventListener('click', () => openSalleDrawer(cell, adminMode));
        cell.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();openSalleDrawer(cell,adminMode);} });
      });
      tableEl.querySelectorAll('.btn-dup[data-dup-uid]').forEach(btn => {
        btn.addEventListener('click', () => duplicateSalleUserWeek(parseInt(btn.dataset.dupUid), btn.dataset.dupName));
      });
    }

    async function loadSalleAdminWeek() {
      document.getElementById('saWeekLabel').textContent = fmtWeekShort(salleAdminWeek);
      const data = await api.get(`/api/salle/hours?weekStart=${salleAdminWeek}`);
      if (!data) return;
      salleWeekData = data;
      buildSalleGrid(document.getElementById('salleTable'), data, true, currentUser?.id);
    }

    async function duplicateSalleUserWeek(userId, userName) {
      const hasConge = (salleWeekData?.shifts || []).some(s => s.user_id === userId && s.is_conge);
      if (hasConge) {
        showToast(`Impossible : ${userName} a un congé approuvé cette semaine`, 'error');
        return;
      }
      const prevWeekStart = addDays(salleAdminWeek, -7);
      const prevData = await api.get(`/api/salle/hours?weekStart=${prevWeekStart}`);
      if (!prevData) return;
      const prevShifts = (prevData.shifts || []).filter(s => s.user_id === userId && s.start_time);
      if (!prevShifts.length) {
        showToast(`Aucun horaire à copier pour la semaine précédente`, 'error');
        return;
      }
      let ok = true;
      for (const s of prevShifts) {
        const dayOffset = (new Date(s.day_date) - new Date(prevWeekStart)) / 86400000;
        const newDate = addDays(salleAdminWeek, dayOffset);
        const res = await api.put('/api/salle/planning', {
          user_id: userId,
          week_start: salleAdminWeek,
          day_date: newDate,
          start_time: s.start_time,
          end_time: s.end_time,
          is_off: 0
        });
        if (!res?.ok) { ok = false; break; }
      }
      if (ok) {
        showToast(`Planning de ${userName} dupliqué`, 'success');
        await loadSalleAdminWeek();
      } else {
        showToast('Erreur lors de la duplication', 'error');
      }
    }

    async function loadSalleStaffWeek() {
      document.getElementById('ssWeekLabel').textContent = fmtWeekShort(salleStaffWeek);
      const data = await api.get(`/api/salle/hours?weekStart=${salleStaffWeek}`);
      if (!data) return;
      salleWeekData = data;
      buildSalleGrid(document.getElementById('salleStaffTable'), data, false, currentUser?.id);
    }

    async function reloadSalleData() {
      const data = await api.get(`/api/salle/hours?weekStart=${isAdmin ? salleAdminWeek : salleStaffWeek}`);
      if (!data) return;
      salleWeekData = data;
      if (isAdmin) buildSalleGrid(document.getElementById('salleTable'), data, true, currentUser?.id);
      else buildSalleGrid(document.getElementById('salleStaffTable'), data, false, currentUser?.id);
    }

    document.getElementById('saPrev').addEventListener('click', ()=>{ salleAdminWeek=addDays(salleAdminWeek,-7); loadSalleAdminWeek(); });
    document.getElementById('saNext').addEventListener('click', ()=>{ salleAdminWeek=addDays(salleAdminWeek, 7); loadSalleAdminWeek(); });
    document.getElementById('ssPrev').addEventListener('click', ()=>{ salleStaffWeek=addDays(salleStaffWeek,-7); loadSalleStaffWeek(); });
    document.getElementById('ssNext').addEventListener('click', ()=>{ salleStaffWeek=addDays(salleStaffWeek, 7); loadSalleStaffWeek(); });

    // ─── Drawer salle ──────────────────────────────────────────────────────────
    function openSalleDrawer(cell, adminMode) {
      const uid    = parseInt(cell.dataset.uid);
      const date   = cell.dataset.date;
      const dayIdx = parseInt(cell.dataset.dayidx);
      const uname  = cell.dataset.uname;
      salleEditCtx = { uid, date, uname };

      document.getElementById('salleDrawerTitle').textContent = `${uname} — ${DAYS_LONG[dayIdx]}`;

      const plan  = salleWeekData?.shifts.find(s=>s.user_id===uid && s.day_date===date);
      const supps = (salleWeekData?.timeEvents||[]).filter(e=>e.user_id===uid && e.date===date);

      let content='', footer='';
      if (adminMode) {
        const isOff = plan?.is_off ? true : false;
        content=`
          <div>
            <div class="drawer-section-title">Heures prévues</div>
            <label class="off-toggle-label" style="margin-bottom:10px">
              <input type="checkbox" id="salleIsOff" ${isOff?'checked':''}>
              <span style="font-size:.9rem;font-weight:600">Jour de repos</span>
            </label>
            <div class="f2" id="salleTimeFields" style="${isOff?'display:none':''}">
              <div class="fgroup"><label for="salleStart">Début</label><input type="time" id="salleStart" class="form-input" value="${plan?.start_time?.slice(0,5)||'10:00'}"></div>
              <div class="fgroup"><label for="salleEnd">Fin</label><input type="time" id="salleEnd" class="form-input" value="${plan?.end_time?.slice(0,5)||'18:00'}"></div>
            </div>
          </div>
          <div>
            <div class="drawer-section-title">Saisies du jour</div>
            ${supps.length ? supps.map(s=>`
              <div class="supp-item" id="supp-${s.id}">
                <span>${(s.type||'supp')==='retard'?'⏱ Retard':'⏰ Supp'} — ${fmtMins(s.minutes)}${s.note?` · ${escapeHtml(s.note)}`:''}</span>
                <button class="supp-del" data-sid="${s.id}" type="button">✕</button>
              </div>`).join('') : '<div style="font-size:.8rem;color:var(--text-muted);padding:4px 0">Aucune saisie</div>'}
            <div style="margin-top:10px">
              <div class="type-toggle">
                <button class="type-btn active" data-type="supp" type="button">Heures sup</button>
                <button class="type-btn" data-type="retard" type="button">Retard</button>
              </div>
              <input type="hidden" id="salleEventType" value="supp">
              <div class="add-supp-row">
                <div class="fgroup" style="flex:1"><label for="salleMin">Minutes</label><input type="number" id="salleMin" class="form-input" placeholder="ex: 30" min="1" max="480"></div>
                <div class="fgroup" style="flex:1"><label for="salleNote">Note</label><input type="text" id="salleNote" class="form-input" placeholder="optionnel"></div>
                <button class="btn btn-secondary" id="btnSalleAddSupp" type="button" style="flex-shrink:0;padding:9px 12px;align-self:flex-end">+</button>
              </div>
            </div>
          </div>`;
        footer=`<button class="btn btn-secondary" id="salleDel" type="button">Effacer</button>
                <button class="btn btn-primary" id="salleSave" type="button">Enregistrer</button>`;
      } else {
        content=`
          <div>
            <div class="drawer-section-title">Heures prévues</div>
            ${plan?.is_conge?'<div class="dc-off" style="padding:8px 0">Congé</div>':plan?.is_off?'<div class="dc-off" style="padding:8px 0">Repos</div>':
              plan?.start_time?`<div class="info-row"><span class="lbl">Créneau</span><span class="val">${plan.start_time.slice(0,5)} → ${plan.end_time?.slice(0,5)||'?'}</span></div>`:
              '<div style="font-size:.8rem;color:var(--text-muted);padding:4px 0">Non planifié</div>'}
          </div>
          <div>
            <div class="drawer-section-title">Mes saisies</div>
            ${supps.length ? supps.map(s=>`
              <div class="supp-item">
                <span>${(s.type||'supp')==='retard'?'⏱ Retard':'⏰ Supp'} — ${fmtMins(s.minutes)}${s.note?` · ${escapeHtml(s.note)}`:''}</span>
                <button class="supp-del" data-sid="${s.id}" type="button">✕</button>
              </div>`).join('') : '<div style="font-size:.8rem;color:var(--text-muted);padding:4px 0">Aucune saisie</div>'}
            <div style="margin-top:10px">
              <div class="type-toggle">
                <button class="type-btn active" data-type="supp" type="button">Heures sup</button>
                <button class="type-btn" data-type="retard" type="button">Retard</button>
              </div>
              <input type="hidden" id="salleEventType" value="supp">
              <div class="add-supp-row">
                <div class="fgroup" style="flex:1"><label for="salleMin">Minutes</label><input type="number" id="salleMin" class="form-input" placeholder="ex: 30" min="1" max="480"></div>
                <div class="fgroup" style="flex:1"><label for="salleNote">Note</label><input type="text" id="salleNote" class="form-input" placeholder="optionnel"></div>
                <button class="btn btn-secondary" id="btnSalleAddSupp" type="button" style="flex-shrink:0;padding:9px 12px;align-self:flex-end">+</button>
              </div>
            </div>
          </div>`;
        footer=`<button class="btn btn-primary" id="salleClose" type="button" style="width:100%">Fermer</button>`;
      }

      document.getElementById('salleDrawerContent').innerHTML = content;
      document.getElementById('salleDrawerFooter').innerHTML  = footer;

      const isOffEl = document.getElementById('salleIsOff');
      if (isOffEl) isOffEl.addEventListener('change', e=>{document.getElementById('salleTimeFields').style.display=e.target.checked?'none':'';});

      document.getElementById('salleSave')?.addEventListener('click', saveSallePlanned);
      document.getElementById('salleDel')?.addEventListener('click', deleteSallePlanned);
      document.getElementById('salleClose')?.addEventListener('click', closeSalleDrawer);

      document.querySelectorAll('#salleDrawerContent .type-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('#salleDrawerContent .type-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('salleEventType').value = btn.dataset.type;
        });
      });
      document.getElementById('btnSalleAddSupp')?.addEventListener('click', addSalleSupp);
      document.querySelectorAll('#salleDrawerContent .supp-del').forEach(btn=>{
        btn.addEventListener('click', ()=>deleteSalleSupp(parseInt(btn.dataset.sid)));
      });

      document.getElementById('salleBackdrop').classList.add('open');
      document.getElementById('salleDrawer').classList.add('open');
      document.getElementById('salleDrawer').removeAttribute('aria-hidden');
    }

    function closeSalleDrawer() {
      document.getElementById('salleBackdrop').classList.remove('open');
      document.getElementById('salleDrawer').classList.remove('open');
      document.getElementById('salleDrawer').setAttribute('aria-hidden','true');
      salleEditCtx = null;
    }
    document.getElementById('salleDrawerClose').addEventListener('click', closeSalleDrawer);
    document.getElementById('salleBackdrop').addEventListener('click', closeSalleDrawer);

    async function saveSallePlanned() {
      if (!salleEditCtx) return;
      const isOff = document.getElementById('salleIsOff').checked;
      const res = await api.put('/api/salle/planning', {
        user_id: salleEditCtx.uid, week_start: salleAdminWeek, day_date: salleEditCtx.date,
        start_time: isOff?null:document.getElementById('salleStart').value,
        end_time:   isOff?null:document.getElementById('salleEnd').value,
        is_off: isOff?1:0,
      });
      if (res?.ok) { closeSalleDrawer(); loadSalleAdminWeek(); }
      else showToast(res?.error||'Erreur','error');
    }

    async function deleteSallePlanned() {
      if (!salleEditCtx) return;
      const res = await api.delete('/api/salle/planning', { user_id:salleEditCtx.uid, day_date:salleEditCtx.date, week_start:salleAdminWeek });
      if (res?.ok) { closeSalleDrawer(); loadSalleAdminWeek(); }
      else showToast(res?.error||'Erreur','error');
    }

    async function addSalleSupp() {
      if (!salleEditCtx) return;
      const min = parseInt(document.getElementById('salleMin').value)||0;
      if (!min) { showToast('Entrez un nombre de minutes','warning'); return; }
      const note = document.getElementById('salleNote').value.trim();
      const type = document.getElementById('salleEventType')?.value||'supp';
      const res = await api.post('/api/salle/time-events', { user_id:salleEditCtx.uid, date:salleEditCtx.date, minutes:min, note, type });
      if (res?.ok) {
        await reloadSalleData();
        const cell = document.querySelector(`[data-uid="${salleEditCtx.uid}"][data-date="${salleEditCtx.date}"]`);
        if (cell) openSalleDrawer(cell, isAdmin);
      } else showToast(res?.error||'Erreur','error');
    }

    async function deleteSalleSupp(id) {
      const res = await api.delete(`/api/salle/time-events/${id}`);
      if (res?.ok) {
        await reloadSalleData();
        const cell = document.querySelector(`[data-uid="${salleEditCtx?.uid}"][data-date="${salleEditCtx?.date}"]`);
        if (cell && salleEditCtx) openSalleDrawer(cell, isAdmin);
      } else showToast(res?.error||'Erreur','error');
    }

    // ─── Congés admin salle ────────────────────────────────────────────────────
    const fmtD  = d => new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
    const labC  = { pending:'En attente', approved:'Validée', rejected:'Refusée' };
    const clsC  = { pending:'sp-pending', approved:'sp-approved', rejected:'sp-rejected' };

    async function loadConges() {
      const data = await api.get('/api/admin/conge-requests');
      const el   = document.getElementById('allDemandesList');
      if (!data?.length) { el.innerHTML='<div class="empty-state">Aucune demande</div>'; return; }
      el.innerHTML=`<ul role="list" style="list-style:none;margin:0;padding:0;">`+
        data.map(d=>`
          <li class="demande-item" id="adm-${d.id}">
            <div class="demande-info">
              <div class="demande-name">${escapeHtml(d.user_name)}</div>
              <strong>${escapeHtml(fmtD(d.date_from))} → ${escapeHtml(fmtD(d.date_to))}</strong>
              <small>Demandé le ${escapeHtml(new Date(d.requested_at).toLocaleDateString('fr-FR'))}${d.reviewed_by?` · Par ${escapeHtml(d.reviewed_by)}`:''}</small>
              ${d.motif?`<div class="demande-motif">${escapeHtml(d.motif)}</div>`:''}
            </div>
            ${d.status==='pending'?`
              <div class="demande-actions">
                <button class="btn-approve" type="button" data-review="${d.id}" data-action="approved">Valider</button>
                <button class="btn-reject"  type="button" data-review="${d.id}" data-action="rejected">Refuser</button>
              </div>`:`<span class="status-pill ${clsC[d.status]}">${escapeHtml(labC[d.status])}</span>`}
          </li>`).join('')+`</ul>`;
      el.querySelectorAll('[data-review]').forEach(btn=>{
        btn.addEventListener('click', ()=>reviewConge(parseInt(btn.dataset.review),btn.dataset.action));
      });
    }

    async function reviewConge(id, status) {
      const res = await api.put(`/api/admin/conge-requests/${id}`,{status});
      if (res?.ok) { showToast(status==='approved'?'Validée':'Refusée',status==='approved'?'success':'error'); loadConges(); }
      else showToast(res?.error||'Erreur','error');
    }

    document.getElementById('btnRefreshConges').addEventListener('click', loadConges);

    // ─── Valider planning salle ────────────────────────────────────────────────
    async function validateSallePlanning(btn) {
      btn.disabled=true; btn.textContent='Export…';
      try {
        const resp = await fetch('/api/salle/planning/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weekStart:salleAdminWeek})});
        if (resp.ok) {
          const blob=await resp.blob(), url=URL.createObjectURL(blob), a=document.createElement('a');
          a.href=url; a.download=`Planning-Salle-${salleAdminWeek}.xlsx`; a.click(); URL.revokeObjectURL(url);
          showToast('Excel envoyé à Paul et téléchargé ✓','success');
        } else showToast('Erreur export Excel','error');
        if (typeof html2canvas!=='undefined') {
          const table=document.getElementById('salleTable');
          const canvas=await html2canvas(table,{backgroundColor:'#0d1f2d',scale:2,useCORS:true});
          canvas.toBlob(blob=>{
            const url=URL.createObjectURL(blob), a=document.createElement('a');
            a.href=url; a.download=`Planning-Salle-${salleAdminWeek}.png`; a.click(); URL.revokeObjectURL(url);
            showToast('Capture téléchargée pour WhatsApp ✓','success');
          },'image/png');
        }
      } catch(e) { showToast('Erreur : '+escapeHtml(e.message),'error'); }
      finally {
        btn.disabled=false;
        btn.innerHTML=`<svg viewBox="0 0 20 20" fill="currentColor" style="width:15px;height:15px;flex-shrink:0"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg> Valider`;
      }
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // CUISINE — GRILLE
    // ═══════════════════════════════════════════════════════════════════════════

    let cuisineWeekStart = getMonday();
    let cuisineData      = { users:[], shifts:[], timeEvents:[] };
    let capturedBlob     = null;
    let _logCtx          = null;

    async function loadCuisineWeek() {
      const ws  = cuisineWeekStart;
      const we  = addDays(ws,6);
      document.getElementById('cuiWeekLabel').textContent = fmtWeekShort(ws);
      const [data,events] = await Promise.all([
        api.get(`/api/cuisine/planning?weekStart=${ws}`),
        api.get(`/api/cuisine/time-events?from=${ws}&to=${we}`),
      ]);
      if (!data) return;
      cuisineData = {...data, timeEvents:events||[]};
      renderCuisine();
    }

    function renderCuisine() {
      const today    = todayStr();
      const dayDates = Array.from({length:7},(_,i)=>addDays(cuisineWeekStart,i));
      const myId     = currentUser?.id;

      document.getElementById('cuisineHead').innerHTML=`<tr>
        <th scope="col" style="min-width:90px;text-align:left;padding-left:10px">Staff</th>
        ${dayDates.map((dd,i)=>{
          const isToday=dd===today, [,dm,dj]=dd.split('-');
          return `<th scope="col" class="${isToday?'today-col':''}">${DAYS_SHORT[i]}<br><span style="font-weight:400;font-size:.68rem">${dj}/${dm}</span></th>`;
        }).join('')}
      </tr>`;

      document.getElementById('cuisineBody').innerHTML=cuisineData.users.map(u=>{
        const isOwnRow=u.id===myId;
        return `<tr${isOwnRow?' class="row-me"':''}><th scope="row" class="staff-name-cell">${escapeHtml(u.name)}</th>
          ${dayDates.map(dd=>{
            const shift=cuisineData.shifts.find(s=>s.user_id===u.id&&s.day_date===dd);
            const evs=cuisineData.timeEvents.filter(e=>e.user_id===u.id&&e.date===dd);
            const suppMin=evs.filter(e=>(e.type||'supp')!=='retard').reduce((a,e)=>a+(e.minutes||0),0);
            const retardMin=evs.filter(e=>e.type==='retard').reduce((a,e)=>a+(e.minutes||0),0);
            const isToday=dd===today;
            const badges=(suppMin>0?`<span class="dc-supp">+${fmtMins(suppMin)}</span>`:'')+(retardMin>0?`<span class="dc-retard">−${fmtMins(retardMin)}</span>`:'');
            let cellHtml,cellClass,ariaLabel='',interactive='';
            if (!shift) {
              cellClass='shift-cell is-empty'; cellHtml=isChef?`<span class="sc-empty">+</span>`:''; ariaLabel=`${u.name}, non planifié`;
            } else if (shift.is_conge) {
              cellClass='shift-cell is-off'; cellHtml=`<span class="sc-off">Congé</span>`; ariaLabel=`${u.name}, congé`;
            } else if (shift.is_off) {
              cellClass='shift-cell is-off'; cellHtml=`<span class="sc-off">Repos</span>`; ariaLabel=`${u.name}, repos`;
            } else {
              const s=shift.start_time?.slice(0,5)||'', e=shift.end_time?.slice(0,5)||'';
              cellClass='shift-cell is-work'; cellHtml=`<span class="sc-time">${escapeHtml(s)}<br>${escapeHtml(e)}</span>`; ariaLabel=`${u.name}, ${s} à ${e}`;
            }
            if (isChef && !isOwnRow) interactive=`role="button" tabindex="0" data-uid="${u.id}" data-date="${dd}" data-name="${escapeHtml(u.name)}" data-action="shift" aria-label="Modifier : ${ariaLabel}"`;
            else if (isOwnRow||isChef) interactive=`role="button" tabindex="0" data-uid="${u.id}" data-date="${dd}" data-name="${escapeHtml(u.name)}" data-action="log" aria-label="Saisie : ${ariaLabel}"`;
            return `<td class="${isToday?'today-col':''}"><div class="${cellClass}" ${interactive}>${cellHtml}${badges}</div></td>`;
          }).join('')}
        </tr>`;
      }).join('');

      document.getElementById('cuisineBody').querySelectorAll('[data-uid]').forEach(cell=>{
        const handler=()=>{
          if (cell.dataset.action==='shift') openCuisineShiftEditor(parseInt(cell.dataset.uid),cell.dataset.date,cell.dataset.name,cell);
          else openLogDrawer(parseInt(cell.dataset.uid),cell.dataset.date,cell.dataset.name,cell);
        };
        cell.addEventListener('click',handler);
        cell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();}});
      });
    }

    document.getElementById('cuiPrev').addEventListener('click',()=>{cuisineWeekStart=addDays(cuisineWeekStart,-7);loadCuisineWeek();});
    document.getElementById('cuiNext').addEventListener('click',()=>{cuisineWeekStart=addDays(cuisineWeekStart, 7);loadCuisineWeek();});

    // ─── Drawers cuisine ───────────────────────────────────────────────────────
    let _cuisineTrigger = null;

    function openCuisineDrawer(id, triggerEl=null) {
      _cuisineTrigger=triggerEl;
      document.getElementById('cuisineBackdrop').classList.add('open');
      const drawer=document.getElementById(id);
      drawer.classList.add('open');
      document.body.style.overflow='hidden';
      setTimeout(()=>{const f=drawer.querySelector('button:not([disabled]),input,select');if(f)f.focus();},50);
    }

    function closeCuisineDrawers() {
      document.getElementById('cuisineBackdrop').classList.remove('open');
      document.querySelectorAll('#shiftDrawer,#logDrawer,#previewDrawer').forEach(d=>d.classList.remove('open'));
      document.body.style.overflow='';
      if (_cuisineTrigger){_cuisineTrigger.focus();_cuisineTrigger=null;}
    }

    document.getElementById('cuisineBackdrop').addEventListener('click',closeCuisineDrawers);
    document.getElementById('closeShiftDrawer').addEventListener('click',closeCuisineDrawers);
    document.getElementById('cancelShiftDrawer').addEventListener('click',closeCuisineDrawers);
    document.getElementById('closeLogDrawer').addEventListener('click',closeCuisineDrawers);
    document.getElementById('closeLogDrawerFooter').addEventListener('click',closeCuisineDrawers);
    document.getElementById('closePreviewDrawer').addEventListener('click',closeCuisineDrawers);
    document.getElementById('closePreviewDrawerFooter').addEventListener('click',closeCuisineDrawers);
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSalleDrawer();closeCuisineDrawers();}});

    function openCuisineShiftEditor(userId,dayDate,userName,triggerEl=null) {
      if (!isChef) return;
      const d=new Date(dayDate);
      document.getElementById('shiftDrawerTitle').textContent=`${userName} — ${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}`;
      document.getElementById('shiftUserId').value=userId;
      document.getElementById('shiftDayDate').value=dayDate;
      const shift=cuisineData.shifts.find(s=>s.user_id===userId&&s.day_date===dayDate);
      const isOff=shift?.is_off;
      document.getElementById('shiftIsOff').checked=!!isOff;
      document.getElementById('shiftStart').value=shift?.start_time?.slice(0,5)||'09:00';
      document.getElementById('shiftEnd').value=shift?.end_time?.slice(0,5)||'17:00';
      document.getElementById('shiftTimeFields').style.display=isOff?'none':'flex';
      openCuisineDrawer('shiftDrawer',triggerEl);
    }

    document.getElementById('shiftIsOff').addEventListener('change',function(){
      document.getElementById('shiftTimeFields').style.display=this.checked?'none':'flex';
    });

    document.getElementById('shiftForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const isOff=document.getElementById('shiftIsOff').checked;
      await api.put('/api/cuisine/planning',{
        user_id:parseInt(document.getElementById('shiftUserId').value),
        day_date:document.getElementById('shiftDayDate').value,
        week_start:cuisineWeekStart,
        start_time:isOff?null:document.getElementById('shiftStart').value,
        end_time:isOff?null:document.getElementById('shiftEnd').value,
        is_off:isOff?1:0,
      });
      closeCuisineDrawers(); await loadCuisineWeek();
      showToast('Planning mis à jour','success');
    });

    document.getElementById('btnClearShift').addEventListener('click',()=>{
      showCuisineConfirm('Effacer ce créneau ?',async()=>{
        await fetch('/api/cuisine/planning',{method:'DELETE',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({user_id:parseInt(document.getElementById('shiftUserId').value),day_date:document.getElementById('shiftDayDate').value,week_start:cuisineWeekStart})});
        closeCuisineDrawers(); await loadCuisineWeek();
        showToast('Créneau supprimé','info');
      });
    });

    function openLogDrawer(userId,dayDate,userName,triggerEl=null) {
      _logCtx={userId,dayDate,userName};
      const d=new Date(dayDate);
      document.getElementById('logDrawerTitle').textContent=`${userName} — ${d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}`;
      renderLogBody();
      openCuisineDrawer('logDrawer',triggerEl);
    }

    function renderLogBody() {
      const {userId,dayDate}=_logCtx;
      const myId=currentUser?.id;
      const evs=cuisineData.timeEvents.filter(e=>e.user_id===userId&&e.date===dayDate);
      const canDelete=userId===myId||isChef;
      document.getElementById('logDrawerBody').innerHTML=`<div class="frow">
        <div>
          <div class="drawer-section-title">Saisies du jour</div>
          ${evs.length?evs.map(e=>`
            <div class="supp-item">
              <span>${e.type==='retard'?'⏱ Retard':'⏰ Supp'} — ${fmtMins(e.minutes)}${e.note?` · ${escapeHtml(e.note)}`:''}</span>
              ${canDelete?`<button class="supp-del" data-eid="${e.id}" type="button">✕</button>`:''}
            </div>`).join('') : '<div style="font-size:.8rem;color:var(--text-muted);padding:4px 0">Aucune saisie</div>'}
        </div>
        <div>
          <div class="drawer-section-title">Ajouter</div>
          <div class="type-toggle">
            <button class="type-btn active" data-type="supp" type="button">Heures sup</button>
            <button class="type-btn" data-type="retard" type="button">Retard</button>
          </div>
          <input type="hidden" id="logEventType" value="supp">
          <div class="add-supp-row">
            <div class="fgroup" style="flex:1"><label for="logMin">Minutes</label><input type="number" id="logMin" class="form-input" placeholder="ex: 30" min="1" max="480"></div>
            <div class="fgroup" style="flex:1"><label for="logNote">Note</label><input type="text" id="logNote" class="form-input" placeholder="optionnel"></div>
            <button class="btn btn-secondary" id="btnAddLog" type="button" style="flex-shrink:0;padding:9px 12px;align-self:flex-end">+</button>
          </div>
        </div>
      </div>`;
      document.querySelectorAll('#logDrawerBody .type-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{document.querySelectorAll('#logDrawerBody .type-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('logEventType').value=btn.dataset.type;});
      });
      document.querySelectorAll('#logDrawerBody .supp-del[data-eid]').forEach(btn=>{
        btn.addEventListener('click',()=>deleteCuisineEvent(parseInt(btn.dataset.eid)));
      });
      document.getElementById('btnAddLog').addEventListener('click',addCuisineEvent);
    }

    async function addCuisineEvent() {
      const {userId,dayDate}=_logCtx;
      const min=parseInt(document.getElementById('logMin').value)||0;
      if (!min){showToast('Entrez un nombre de minutes','warning');return;}
      const note=document.getElementById('logNote').value.trim();
      const type=document.getElementById('logEventType').value||'supp';
      const res=await api.post('/api/cuisine/time-events',{user_id:userId,date:dayDate,minutes:min,note,type});
      if (res?.ok){await loadCuisineWeek();renderLogBody();showToast('Saisie enregistrée','success');}
      else showToast(res?.error||'Erreur','error');
    }

    async function deleteCuisineEvent(eventId) {
      const r=await fetch(`/api/cuisine/time-events/${eventId}`,{method:'DELETE'});
      if (r.status===401){window.location.href='/';return;}
      await loadCuisineWeek(); renderLogBody();
      showToast('Saisie supprimée','info');
    }

    // ─── Preview WhatsApp cuisine ──────────────────────────────────────────────
    async function openCuisinePreview(triggerEl=null) {
      capturedBlob=null;
      document.getElementById('previewImg').style.display='none';
      document.getElementById('btnShare').style.display='none';
      document.getElementById('previewLoading').style.display='block';
      document.getElementById('previewLoading').textContent="Génération de l'image…";
      openCuisineDrawer('previewDrawer',triggerEl);
      try {
        const table=document.getElementById('cuisineTable');
        const canvas=await html2canvas(table,{backgroundColor:'#08141c',scale:2,useCORS:true,logging:false});
        canvas.toBlob(blob=>{
          capturedBlob=blob;
          const img=document.getElementById('previewImg');
          img.src=URL.createObjectURL(blob); img.style.display='block';
          document.getElementById('previewLoading').style.display='none';
          document.getElementById('btnShare').style.display='flex';
        },'image/png');
      } catch(e){document.getElementById('previewLoading').textContent='Erreur lors de la capture';}
    }

    document.getElementById('btnShare').addEventListener('click',async()=>{
      if (!capturedBlob) return;
      const filename=`planning-cuisine-${cuisineWeekStart}.png`;
      const file=new File([capturedBlob],filename,{type:'image/png'});
      if (navigator.canShare&&navigator.canShare({files:[file]})) {
        try{await navigator.share({files:[file],title:`Planning Cuisine — ${fmtWeekShort(cuisineWeekStart)}`});closeCuisineDrawers();}catch(e){}
      } else {
        const a=document.createElement('a');a.href=URL.createObjectURL(capturedBlob);a.download=filename;a.click();
        showToast('Image téléchargée — envoie-la sur WhatsApp','success');
      }
    });

    // ─── Valider planning cuisine ──────────────────────────────────────────────
    async function validateCuisinePlanning(btn) {
      btn.disabled=true; btn.textContent='Export…';
      try {
        const resp=await fetch('/api/cuisine/planning/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weekStart:cuisineWeekStart})});
        if (resp.ok) {
          const blob=await resp.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');
          a.href=url;a.download=`Planning-Cuisine-${cuisineWeekStart}.xlsx`;a.click();URL.revokeObjectURL(url);
          showToast('Excel envoyé à Paul et téléchargé ✓','success');
        } else showToast('Erreur export Excel','error');
      } catch(e){showToast('Erreur : '+e.message,'error');}
      finally{btn.disabled=false;btn.textContent='Valider le planning';}
      openCuisinePreview(btn);
    }

    // ─── Confirm modal cuisine ─────────────────────────────────────────────────
    let _confirmCb=null;
    function showCuisineConfirm(msg,cb){
      _confirmCb=cb;
      document.getElementById('confirmMsg').textContent=msg;
      showModal('confirmModal');
      setTimeout(()=>document.getElementById('confirmCancel').focus(),50);
    }
    document.getElementById('confirmCancel').addEventListener('click',()=>{hideModal('confirmModal');_confirmCb=null;});
    document.getElementById('confirmOk').addEventListener('click',()=>{hideModal('confirmModal');if(_confirmCb){_confirmCb();_confirmCb=null;}});

    // ─── Socket.io ─────────────────────────────────────────────────────────────
    socket.on('cuisine:planning:updated',({weekStart,data})=>{
      if (weekStart===cuisineWeekStart){cuisineData=data;renderCuisine();}
    });

    // ═══════════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════════
    (async()=>{
      currentUser = await api.get('/api/auth/me');
      if (!currentUser) return;

      const role  = currentUser.role;
      const shift = currentUser.shift;
      isAdmin = role==='admin' || (role==='manager' && shift!=='cuisine');
      isChef  = role==='admin' || (role==='manager' && shift==='cuisine');
      showSalle   = role==='admin' || role==='manager' || shift==='midi' || shift==='soir';
      showCuisine = role==='admin' || isChef || shift==='cuisine';

      // Masquer l'onglet non concerné
      if (!showSalle)   { document.getElementById('tab-salle').hidden=true;   document.getElementById('pane-salle').hidden=true; }
      if (!showCuisine) { document.getElementById('tab-cuisine').hidden=true; }

      // Si une seule section : masquer la barre d'onglets
      if (!showSalle||!showCuisine) document.getElementById('planningTabs').style.display='none';

      // Onglet par défaut : cuisine si uniquement cuisine, sinon salle
      if (!showSalle && showCuisine) {
        document.getElementById('tab-cuisine').setAttribute('aria-selected','true');
        document.getElementById('tab-cuisine').setAttribute('tabindex','0');
        document.getElementById('tab-cuisine').classList.add('active');
        document.getElementById('pane-cuisine').hidden=false;
        document.getElementById('pane-salle').hidden=true;
      }

      // Header actions
      const actions = document.getElementById('headerActions');
      if (role==='admin'||role==='manager') {
        // Lien congés (salle)
        if (showSalle) {
          const linkC=document.createElement('a');
          linkC.href='/staff/conges.html';
          linkC.className='btn-conge';
          linkC.innerHTML=`<svg viewBox="0 0 20 20" fill="currentColor" style="width:15px;height:15px"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg> Congés`;
          actions.appendChild(linkC);
        }
        // Bouton valider salle
        if (showSalle) {
          const btnVS=document.createElement('button');
          btnVS.className='btn btn-primary btn-sm'; btnVS.id='btnValidateSalle';
          btnVS.innerHTML=`<svg viewBox="0 0 20 20" fill="currentColor" style="width:14px;height:14px;flex-shrink:0"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg> Valider Salle`;
          btnVS.addEventListener('click',()=>validateSallePlanning(btnVS));
          actions.appendChild(btnVS);
        }
        // Bouton valider cuisine
        if (isChef||role==='admin') {
          const btnVC=document.createElement('button');
          btnVC.className='btn btn-secondary btn-sm'; btnVC.id='btnValidateCuisine';
          btnVC.textContent='Valider Cuisine';
          btnVC.addEventListener('click',()=>validateCuisinePlanning(btnVC));
          actions.appendChild(btnVC);
        }
      } else {
        // Staff : bouton congés
        const linkC=document.createElement('a');
        linkC.href='/staff/conges.html';
        linkC.className='btn-conge';
        linkC.innerHTML=`<svg viewBox="0 0 20 20" fill="currentColor" style="width:15px;height:15px"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg> Mes congés`;
        actions.appendChild(linkC);
      }

      // Afficher les vues salle
      if (showSalle) {
        if (isAdmin) {
          document.getElementById('salleAdminView').style.display='';
          document.getElementById('congesSection').style.display='';
          loadSalleAdminWeek();
          loadConges();
        } else {
          document.getElementById('salleStaffView').style.display='';
          loadSalleStaffWeek();
        }
      }

      // Readonly badge cuisine
      if (showCuisine && !isChef) {
        document.getElementById('cuisineReadonlyBadge').classList.remove('hidden');
      }

      // Charger cuisine si onglet actif d'entrée
      if (!showSalle && showCuisine) { loadCuisineWeek(); _cuisineLoaded=true; }
    })();
  </script>
</body>
</html>
